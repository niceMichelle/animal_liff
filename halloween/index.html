<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Circle 搗蛋夜</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 夜晚場景：月亮、星星、飛過的蝙蝠、遠方墓園剪影（皆為 SVG/CSS 生成） -->
  <div class="night" aria-hidden="true">
    <svg class="moon" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="moonGrad" cx="38%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#fff1cf" />
          <stop offset="60%" stop-color="#ffd98f" />
          <stop offset="100%" stop-color="#f3b764" />
        </radialGradient>
      </defs>
      <circle cx="50" cy="50" r="42" fill="url(#moonGrad)" />
      <circle cx="34" cy="38" r="6" fill="#e9a955" opacity="0.35" />
      <circle cx="62" cy="62" r="9" fill="#e9a955" opacity="0.3" />
      <circle cx="66" cy="34" r="4" fill="#e9a955" opacity="0.3" />
    </svg>

    <span class="star" style="--x:12%;--y:14%;--s:2px;--d:0s"></span>
    <span class="star" style="--x:28%;--y:7%;--s:1.5px;--d:1.1s"></span>
    <span class="star" style="--x:48%;--y:12%;--s:2px;--d:2.4s"></span>
    <span class="star" style="--x:86%;--y:26%;--s:1.5px;--d:1.8s"></span>
    <span class="star" style="--x:6%;--y:30%;--s:1.5px;--d:3s"></span>
    <span class="star" style="--x:38%;--y:22%;--s:1.5px;--d:.8s"></span>

    <svg class="bat bat-1" viewBox="0 0 80 40"><g class="wings">
      <ellipse cx="40" cy="21" rx="2.6" ry="4.6"/>
      <path d="M40 22 C36 12 30 14 24 9 C25 15 19 17 13 15 C19 19 18 25 24 24 C30 23 35 24 40 26 Z
               M40 22 C44 12 50 14 56 9 C55 15 61 17 67 15 C61 19 62 25 56 24 C50 23 45 24 40 26 Z"/></g></svg>
    <svg class="bat bat-2" viewBox="0 0 80 40"><g class="wings">
      <ellipse cx="40" cy="21" rx="2.6" ry="4.6"/>
      <path d="M40 22 C36 12 30 14 24 9 C25 15 19 17 13 15 C19 19 18 25 24 24 C30 23 35 24 40 26 Z
               M40 22 C44 12 50 14 56 9 C55 15 61 17 67 15 C61 19 62 25 56 24 C50 23 45 24 40 26 Z"/></g></svg>

    <!-- 遠方墓園：山丘、墓碑、枯樹 -->
    <svg class="graveyard" viewBox="0 0 400 120" preserveAspectRatio="xMidYMax slice">
      <path class="hill-back" d="M0 70 C60 50 120 58 180 66 C250 76 320 46 400 58 V120 H0 Z"/>
      <g class="stones">
        <path d="M40 72 v-18 a10 10 0 0 1 20 0 v18 Z"/>
        <path d="M78 74 v-12 h-5 v-5 h5 v-6 h5 v6 h5 v5 h-5 v12 Z"/>
        <path d="M300 64 v-16 a9 9 0 0 1 18 0 v16 Z"/>
        <path d="M340 62 v-10 h-4 v-4 h4 v-5 h4 v5 h4 v4 h-4 v10 Z"/>
        <path d="M218 76 C214 60 206 50 196 44 M210 62 C220 54 226 50 232 40 M204 52 C198 48 192 46 186 48" fill="none" stroke-width="3.5" stroke-linecap="round"/>
      </g>
      <path class="hill-front" d="M0 96 C80 84 160 90 220 94 C290 98 340 84 400 90 V120 H0 Z"/>
    </svg>
    <div class="fog"></div>
  </div>

  <main class="app">

    <!-- 開始畫面 -->
    <section class="screen is-active" id="screen-start" aria-labelledby="start-title">
      <p class="eyebrow">動物夥伴變裝派對</p>
      <h1 class="title" id="start-title">Circle 搗蛋夜</h1>
      <p class="lede">動物們扮好裝要去討糖了！<br />30 秒內盡量打中牠們，但別敲到骷髏和幽靈。</p>

      <!-- 活動橫幅：最高分送禮物（期間外自動隱藏，設定在 js/event.js） -->
      <div class="event" id="event-banner" hidden>
        <p class="event-head" id="event-head"></p>
        <p class="event-sub" id="event-sub"></p>
        <details class="event-rules">
          <summary>活動辦法</summary>
          <ol id="event-rules"></ol>
        </details>
      </div>

      <ul class="legend" id="legend"></ul>

      <fieldset class="diff" id="diff">
        <legend class="diff-label">選擇難度</legend>
        <div class="diff-options" id="diff-options"></div>
        <p class="diff-desc" id="diff-desc"></p>
      </fieldset>

      <p class="best" id="best-start"></p>

      <div class="actions">
        <button class="btn-icon" id="btn-sound" type="button" aria-pressed="true" aria-label="音效：開">🔊</button>
        <button class="btn-primary" id="btn-start" type="button">開始搗蛋！</button>
      </div>
    </section>

    <!-- 遊戲畫面 -->
    <section class="screen" id="screen-play" aria-label="遊戲中">
      <div class="hud">
        <div class="hud-score">
          <span class="hud-label">分數</span>
          <span class="hud-num" id="score">0</span>
        </div>
        <div class="hud-combo" id="combo" aria-live="polite"></div>
        <div class="hud-time">
          <span class="hud-label">剩餘</span>
          <span class="hud-num" id="time">30</span>
        </div>
        <button class="btn-pause" id="btn-pause" type="button" aria-label="暫停"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg></button>
      </div>
      <div class="timebar"><span id="timebar"></span></div>

      <div class="board" id="board"></div>

      <div class="countdown" id="countdown" aria-live="assertive"></div>
    </section>

    <!-- 結算畫面 -->
    <section class="screen" id="screen-end" aria-labelledby="end-who">
      <p class="eyebrow" id="end-diff"></p>
      <h2 class="end-who" id="end-who">你的戰績</h2>
      <div class="end-score" id="end-score">0</div>
      <p class="end-badge" id="end-badge" hidden>新紀錄！</p>
      <p class="end-title" id="end-title"></p>
      <ul class="end-stats">
        <li><span id="stat-hits">0</span>打中</li>
        <li><span id="stat-combo">0</span>最高連擊</li>
        <li><span id="stat-bad">0</span>誤擊</li>
      </ul>
      <p class="best" id="best-end"></p>

      <!-- 活動排行榜（只在活動期間顯示） -->
      <div class="rank" id="rank" hidden>
        <h3 class="rank-title" id="rank-title">🎁 活動排行榜</h3>
        <p class="rank-me" id="rank-me" aria-live="polite"></p>
        <ol class="rank-list" id="rank-list"></ol>
      </div>

      <div class="end-actions">
        <button class="btn-primary" id="btn-share" type="button" hidden>傳給好友挑戰</button>
        <p class="share-status" id="share-status" aria-live="polite"></p>
        <button class="btn-primary" id="btn-again" type="button">再玩一次</button>
        <div class="end-row">
          <button class="btn-ghost" id="btn-home" type="button">換個難度</button>
          <button class="btn-ghost" id="btn-close" type="button" hidden>離開</button>
        </div>
      </div>
    </section>

  </main>

  <!-- 暫停 -->
  <div class="overlay" id="pause" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="overlay-card">
      <h2 class="overlay-title" id="pause-title">遊戲暫停</h2>
      <p class="overlay-text">南瓜燈還亮著，準備好就繼續吧。</p>
      <button class="btn-primary" id="btn-resume" type="button">繼續</button>
      <button class="btn-ghost" id="btn-quit" type="button">結束這局</button>
    </div>
  </div>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 應用程式模組 -->
  <script src="js/characters.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/sfx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/liff-init.js"></script>
  <script src="js/event.js"></script>

  <!-- 介面接線（DOM × 引擎 × 音效 × LIFF） -->
  <script>
    (function () {
      const HOLES = 9;
      const CHARS = window.HALLOWEEN_CHARACTERS;
      const DIFFS = window.HALLOWEEN_DIFFICULTY;
      const $ = (id) => document.getElementById(id);

      const screens = { start: $('screen-start'), play: $('screen-play'), end: $('screen-end') };
      const el = {
        legend: $('legend'), diffOptions: $('diff-options'), diffDesc: $('diff-desc'),
        bestStart: $('best-start'), btnSound: $('btn-sound'), btnStart: $('btn-start'),
        score: $('score'), combo: $('combo'), time: $('time'), timebar: $('timebar'),
        board: $('board'), countdown: $('countdown'), btnPause: $('btn-pause'),
        endDiff: $('end-diff'), endWho: $('end-who'), endScore: $('end-score'), endBadge: $('end-badge'),
        endTitle: $('end-title'), statHits: $('stat-hits'), statCombo: $('stat-combo'), statBad: $('stat-bad'),
        bestEnd: $('best-end'), btnShare: $('btn-share'), shareStatus: $('share-status'),
        btnAgain: $('btn-again'), btnHome: $('btn-home'), btnClose: $('btn-close'),
        pause: $('pause'), btnResume: $('btn-resume'), btnQuit: $('btn-quit'),
        eventBanner: $('event-banner'), eventHead: $('event-head'), eventSub: $('event-sub'),
        eventRules: $('event-rules'), rank: $('rank'), rankTitle: $('rank-title'), rankMe: $('rank-me'), rankList: $('rank-list'),
      };
      const EVENT = window.HALLOWEEN_EVENT;
      const Ev = window.HalloweenEvent;

      const sfx = new window.HalloweenSfx();
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let currentType = window.DEFAULT_PATTERN;
      let game = null;
      let countdownTimers = [];
      let lastResult = null;
      let sessionPromise = null; // 這局的活動場次憑證（不計入活動時為 null）

      // —— 畫面切換 ——
      function show(name) {
        Object.entries(screens).forEach(([k, s]) => s.classList.toggle('is-active', k === name));
        document.body.dataset.screen = name;
      }

      // —— 最佳紀錄（localStorage 可能被擋，一律包 try/catch） ——
      function bestKey(type) { return 'halloween-whack-best-' + type; }
      function getBest(type) {
        try { return parseInt(localStorage.getItem(bestKey(type)), 10) || 0; } catch (_) { return 0; }
      }
      function setBest(type, score) {
        try { localStorage.setItem(bestKey(type), String(score)); } catch (_) { /* 略過 */ }
      }
      function bestText(type) {
        const b = getBest(type);
        return b > 0 ? DIFFS[type].name + '最佳紀錄：' + b + ' 分' : '';
      }

      function titleFor(score) {
        return window.HALLOWEEN_TITLES.find((t) => score < t.max).title;
      }

      // —— 開始畫面 ——
      function buildLegend() {
        el.legend.innerHTML = '';
        Object.values(CHARS).forEach((c) => {
          const li = document.createElement('li');
          li.className = 'legend-item ' + (c.good ? 'is-good' : 'is-bad');
          li.innerHTML =
            '<span class="legend-icon" aria-hidden="true">' + c.svg + '</span>' +
            '<span class="legend-name">' + c.name + '</span>' +
            '<span class="legend-pts">' + (c.good ? '+' : '−') + c.points + '</span>';
          el.legend.appendChild(li);
        });
      }

      function buildDiff() {
        el.diffOptions.innerHTML = '';
        Object.entries(DIFFS).forEach(([key, d]) => {
          const label = document.createElement('label');
          label.className = 'diff-opt';
          label.innerHTML = '<input type="radio" name="diff" value="' + key + '" /><span>' + d.name + '</span>';
          const input = label.querySelector('input');
          input.checked = key === currentType;
          input.addEventListener('change', () => selectDiff(key));
          el.diffOptions.appendChild(label);
        });
        selectDiff(currentType);
      }

      function selectDiff(key) {
        currentType = key;
        el.diffDesc.textContent = DIFFS[key].desc;
        el.bestStart.textContent = bestText(key);
        renderEvent();
      }

      // —— 活動橫幅 ——
      // 活動難度名稱，例如「標準」與「惡夢」
      function eventTypeNames() {
        return EVENT.types.map((t) => '「' + DIFFS[t].name + '」').join('與');
      }

      function renderEvent() {
        const phase = Ev.phase();
        if (!Ev.configured() || phase === 'ended') { el.eventBanner.hidden = true; return; }
        const names = eventTypeNames();
        el.eventBanner.hidden = false;
        if (phase === 'upcoming') {
          el.eventHead.textContent = '🎁 ' + EVENT.label + ' 最高分挑戰';
          el.eventSub.textContent = '活動期間' + names + '難度各自排名，各難度第一名可獲得' + EVENT.prize + '！';
        } else {
          el.eventHead.textContent = '🎁 ' + names + '第一名各送' + EVENT.prize + '！';
          let sub = EVENT.label + '，兩個難度分開排名。';
          if (window.AppLiff.standalone) sub += '請從 LINE 開啟遊戲才能登上排行榜。';
          else if (!Ev.counts(currentType)) sub += '目前選的難度不計入活動喔。';
          el.eventSub.textContent = sub;
        }
      }

      function buildRules() {
        const names = eventTypeNames();
        const rules = [
          '活動期間：' + EVENT.label + '（台灣時間），以伺服器收到成績的時間為準。',
          '計分難度：' + names + '，兩個難度分開排名；每位玩家在各難度取自己的最高分。',
          '排行榜同分時，依達到該分數的先後排名，越早達到者名次越前面（以伺服器收到成績的時間為準）。',
          '各難度僅由該難度排行榜第一名，也就是「第一位達到最高分」的玩家獲得' + EVENT.prize + '一份；之後才達到相同分數者不得獎。',
          '每人限領一份禮物：若同一位玩家同時是兩個難度的第一名，只頒發「' + DIFFS[EVENT.prizeOrder[0]].name + '」難度的禮物，不提供選擇；「' + DIFFS[EVENT.prizeOrder[1]].name + '」難度的禮物改由該難度第二名遞補。',
          '須在 LINE 中開啟遊戲，並加入本官方帳號好友，以便通知得獎。',
          '得獎者於活動結束後 7 天內以 LINE 訊息通知。',
          '系統會自動檢查異常成績；主辦單位保留取消異常成績及調整活動辦法的權利。',
          '參加即同意蒐集你的 LINE 顯示名稱與使用者識別碼，僅用於排名與聯絡得獎者，活動結束後刪除。',
        ];
        el.eventRules.innerHTML = '';
        rules.forEach((t) => {
          const li = document.createElement('li');
          li.textContent = t;
          el.eventRules.appendChild(li);
        });
      }

      el.btnSound.addEventListener('click', () => {
        const on = !sfx.enabled;
        sfx.setEnabled(on);
        el.btnSound.textContent = on ? '🔊' : '🔇';
        el.btnSound.setAttribute('aria-pressed', String(on));
        el.btnSound.setAttribute('aria-label', '音效：' + (on ? '開' : '關'));
      });

      // —— 棋盤 ——
      const holes = [];
      function buildBoard() {
        for (let i = 0; i < HOLES; i++) {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'hole';
          b.dataset.i = i;
          b.setAttribute('aria-label', '第 ' + (i + 1) + ' 個洞');
          b.innerHTML = '<span class="pit"></span><span class="window"><span class="critter"></span></span><span class="mound"></span>';
          el.board.appendChild(b);
          holes.push({ btn: b, critter: b.querySelector('.critter'), hideTimer: null });
        }
      }

      function tapHole(i) {
        if (game) game.hit(i);
      }
      // 觸控用 pointerdown，避免 click 的延遲；鍵盤（click 且 detail 為 0）也能玩
      el.board.addEventListener('pointerdown', (e) => {
        const b = e.target.closest('.hole');
        if (!b) return;
        e.preventDefault();
        tapHole(Number(b.dataset.i));
      });
      el.board.addEventListener('click', (e) => {
        const b = e.target.closest('.hole');
        if (b && e.detail === 0) tapHole(Number(b.dataset.i));
      });
      el.board.addEventListener('contextmenu', (e) => e.preventDefault());

      function popText(i, text, cls) {
        const s = document.createElement('span');
        s.className = 'pop ' + cls;
        s.textContent = text;
        holes[i].btn.appendChild(s);
        setTimeout(() => s.remove(), 800);
      }

      function setCombo(combo, mult) {
        if (combo >= 3) {
          el.combo.textContent = combo + ' 連擊' + (mult > 1 ? ' ×' + mult : '');
          el.combo.classList.add('on');
          el.combo.classList.remove('bump');
          void el.combo.offsetWidth;
          el.combo.classList.add('bump');
        } else {
          el.combo.textContent = '';
          el.combo.classList.remove('on', 'bump');
        }
      }

      function resetBoard() {
        holes.forEach((h) => {
          clearTimeout(h.hideTimer);
          h.btn.classList.remove('up', 'hit', 'ouch', 'is-bad');
          h.btn.querySelectorAll('.pop').forEach((p) => p.remove());
        });
      }

      // —— 一局 ——
      function newGame() {
        const cfg = DIFFS[currentType];
        game = new window.WhackGame({
          holes: HOLES,
          config: cfg,
          characters: CHARS,
          on: {
            up(i, key) {
              const h = holes[i];
              clearTimeout(h.hideTimer);
              h.critter.innerHTML = CHARS[key].svg;
              h.btn.classList.remove('hit', 'ouch');
              h.btn.classList.toggle('is-bad', !CHARS[key].good);
              h.btn.classList.add('up');
            },
            down(i, reason) {
              const h = holes[i];
              clearTimeout(h.hideTimer);
              if (reason === 'hit') {
                // 讓打中動畫播一下再縮回
                h.hideTimer = setTimeout(() => h.btn.classList.remove('up', 'hit', 'ouch'), 220);
              } else {
                h.btn.classList.remove('up', 'hit', 'ouch');
              }
            },
            score(info) {
              const h = holes[info.i];
              el.score.textContent = info.score;
              if (info.good) {
                h.btn.classList.add('hit');
                sfx.hit(info.combo);
                popText(info.i, '+' + info.delta, 'is-good');
              } else {
                h.btn.classList.add('ouch');
                sfx.bad();
                popText(info.i, info.delta ? String(info.delta) : '哎呀', 'is-bad');
                if (navigator.vibrate) navigator.vibrate(120);
                if (!reduceMotion) {
                  el.board.classList.remove('shake');
                  void el.board.offsetWidth;
                  el.board.classList.add('shake');
                }
              }
              setCombo(info.combo, info.mult);
            },
            escape() {
              sfx.miss();
              setCombo(0, 1);
            },
            tick(sec) {
              el.time.textContent = sec;
              el.timebar.style.transform = 'scaleX(' + (sec / cfg.duration) + ')';
              el.time.parentElement.classList.toggle('hurry', sec <= 5 && sec > 0);
              if (sec <= 5 && sec > 0) sfx.hurry();
            },
            end(summary) {
              sfx.end();
              setTimeout(() => showEnd(summary), 500);
            },
          },
        });
      }

      function clearCountdown() {
        countdownTimers.forEach(clearTimeout);
        countdownTimers = [];
        el.countdown.classList.remove('on');
        el.countdown.textContent = '';
      }

      async function startGame() {
        sfx.unlock().catch(() => { /* 音效不可用時照樣能玩 */ });
        if (game) game.stop();
        clearCountdown();
        resetBoard();
        el.score.textContent = '0';
        el.time.textContent = DIFFS[currentType].duration;
        el.time.parentElement.classList.remove('hurry');
        el.timebar.style.transform = 'scaleX(1)';
        setCombo(0, 1);
        show('play');
        newGame();

        // 計入活動的局：開局就先向伺服器領場次憑證（失敗也不影響遊戲）
        sessionPromise = Ev.eligible(currentType)
          ? Ev.startSession().catch((err) => ({ error: err }))
          : null;

        // 3、2、1、開始！
        const steps = ['3', '2', '1', '開始！'];
        steps.forEach((t, k) => {
          countdownTimers.push(setTimeout(() => {
            el.countdown.textContent = t;
            el.countdown.classList.remove('on');
            void el.countdown.offsetWidth;
            el.countdown.classList.add('on');
            if (k < 3) sfx.tick(); else sfx.go();
          }, k * 650));
        });
        countdownTimers.push(setTimeout(() => {
          clearCountdown();
          game.start();
        }, steps.length * 650));
      }

      function pauseGame() {
        if (!game || !game.running || game.paused) return;
        game.pause();
        resetBoard();
        el.pause.hidden = false;
        el.btnResume.focus();
      }

      el.btnPause.addEventListener('click', pauseGame);
      el.btnResume.addEventListener('click', () => {
        el.pause.hidden = true;
        sfx.unlock().catch(() => {});
        if (game) game.resume();
      });
      el.btnQuit.addEventListener('click', () => {
        el.pause.hidden = true;
        if (game) game.stop();
        goHome();
      });

      // 切到背景（接電話、切 App）時自動暫停；倒數中則取消回到開始畫面
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) return;
        if (countdownTimers.length) {
          clearCountdown();
          if (game) game.stop();
          goHome();
        } else {
          pauseGame();
        }
      });

      // —— 結算 ——
      function showEnd(summary) {
        const prevBest = getBest(currentType);
        const isNew = summary.score > prevBest;
        if (isNew) setBest(currentType, summary.score);
        const title = titleFor(summary.score);
        lastResult = { score: summary.score, title, type: currentType, diffName: DIFFS[currentType].name };

        const name = window.AppLiff.profile && window.AppLiff.profile.displayName;
        el.endDiff.textContent = 'Circle 搗蛋夜 · ' + DIFFS[currentType].name;
        el.endWho.textContent = name ? name + ' 的戰績' : '你的戰績';
        el.endScore.textContent = summary.score;
        el.endBadge.hidden = !(isNew && summary.score > 0);
        el.endTitle.textContent = '稱號：' + title;
        el.statHits.textContent = summary.hits;
        el.statCombo.textContent = summary.bestCombo;
        el.statBad.textContent = summary.bad;
        el.bestEnd.textContent = bestText(currentType);
        el.btnShare.hidden = !window.AppLiff.canShare();
        el.btnShare.disabled = false;
        el.shareStatus.textContent = '';
        resetBoard();
        show('end');
        el.btnAgain.focus();
        renderRank(summary);
      }

      // —— 活動排行榜 ——
      const REJECT_TEXT = {
        out_of_window: '不在活動期間內',
        wrong_type: '這個難度不計入活動',
        replayed: '這一局已經上傳過了',
        bad_session: '場次憑證無效，請重新開一局',
        too_fast: '遊戲時間不足 30 秒',
        bad_log: '成績紀錄異常',
        score_mismatch: '成績紀錄異常',
      };

      function rankMsg(text, cls) {
        el.rankMe.textContent = text;
        el.rankMe.className = 'rank-me' + (cls ? ' ' + cls : '');
      }

      async function renderRank(summary) {
        el.rankList.innerHTML = '';
        const phase = Ev.phase();
        if (!Ev.configured() || phase === 'ended') { el.rank.hidden = true; return; }
        el.rank.hidden = false;

        if (phase === 'upcoming') {
          el.rankTitle.textContent = '🎁 活動排行榜';
          return rankMsg('活動期間 ' + EVENT.label + '，開始後' + eventTypeNames() + '難度的成績才會列入排行榜。');
        }

        if (window.AppLiff.standalone) return rankMsg('從 LINE 開啟遊戲，成績才會登上排行榜。');
        el.rankTitle.textContent = '🎁 活動排行榜' + (Ev.counts(currentType) ? ' · ' + DIFFS[currentType].name : '');
        if (!Ev.counts(currentType)) return rankMsg('活動只計算' + eventTypeNames() + '難度，換個難度再挑戰吧！');
        if (!sessionPromise) return rankMsg('無法確認你的 LINE 身分，這局成績未上傳。', 'is-warn');

        rankMsg('成績上傳中…');
        const promise = sessionPromise;
        sessionPromise = null;
        try {
          const session = await promise;
          if (!session || session.error) throw session && session.error;
          const r = await Ev.submit(session, currentType, summary);
          renderBoard(r);
        } catch (err) {
          console.warn('上傳成績失敗：', err);
          rankMsg('成績上傳失敗，請確認網路後再玩一次。', 'is-warn');
        }
      }

      function renderBoard(r) {
        if (!r.ok) rankMsg('這局未列入排行：' + (REJECT_TEXT[r.reason] || '成績紀錄異常') + '。', 'is-warn');
        else if (r.me && r.me.rank === 1) rankMsg('🏆 你目前是第一名！最佳 ' + r.me.best + ' 分', 'is-top');
        else if (r.me) rankMsg('你目前第 ' + r.me.rank + ' 名・最佳 ' + r.me.best + ' 分（共 ' + r.total + ' 人參加）');

        const rows = (r.top || []).slice();
        if (r.me && !rows.some((x) => x.me)) rows.push({ gap: true }, { rank: r.me.rank, name: r.me.name, score: r.me.best, me: true });
        el.rankList.innerHTML = '';
        rows.forEach((x) => {
          const li = document.createElement('li');
          if (x.gap) { li.className = 'rank-gap'; li.textContent = '⋯'; }
          else {
            li.className = 'rank-row' + (x.me ? ' is-me' : '') + (x.rank === 1 ? ' is-first' : '');
            li.innerHTML = '<span class="rank-no"></span><span class="rank-name"></span><span class="rank-score"></span>';
            li.children[0].textContent = x.rank === 1 ? '👑' : x.rank;
            li.children[1].textContent = x.name + (x.me ? '（你）' : '');
            li.children[2].textContent = x.score;
          }
          el.rankList.appendChild(li);
        });
      }

      el.btnShare.addEventListener('click', async () => {
        if (!lastResult) return;
        el.btnShare.disabled = true;
        const r = await window.AppLiff.shareScore(lastResult);
        el.btnShare.disabled = false;
        el.shareStatus.textContent = r === 'sent' ? '已傳出挑戰書 🎃' : r === 'failed' ? '分享失敗，請稍後再試' : '';
      });

      function goHome() {
        clearCountdown();
        resetBoard();
        buildDiff();
        show('start');
      }

      el.btnStart.addEventListener('click', startGame);
      el.btnAgain.addEventListener('click', startGame);
      el.btnHome.addEventListener('click', goHome);
      el.btnClose.addEventListener('click', () => window.AppLiff.close());

      // —— 啟動 ——
      buildLegend();
      buildBoard();
      show('start');
      window.AppLiff.init().then(() => {
        currentType = window.AppLiff.getType();
        buildDiff();
        el.btnClose.hidden = window.AppLiff.standalone;
      });
      buildRules();
      buildDiff();
    })();
  </script>
</body>
</html>
