<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>呼吸練習 · 靜息</title>

  <!-- 距離感與安定感的字體：中文 Noto Serif TC、數字 Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 背景：極光漂移 + 顆粒紋理 -->
  <div class="aurora" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- 夜晚場景：月亮、星星、飛過的蝙蝠與貓頭鷹、停棲樹枝的貓頭鷹（皆為 SVG/CSS 生成） -->
  <div class="night" aria-hidden="true">
    <!-- 滿月（隱約微笑、緩緩呼吸） -->
    <svg class="moon" viewBox="0 0 100 100">
      <defs>
        <radialGradient id="moonGrad" cx="38%" cy="34%" r="72%">
          <stop offset="0%" stop-color="#fdf6de" />
          <stop offset="60%" stop-color="#f0e2b2" />
          <stop offset="100%" stop-color="#e3cf96" />
        </radialGradient>
      </defs>
      <circle class="moon-disc" cx="50" cy="50" r="42" fill="url(#moonGrad)" />
      <g class="moon-face">
        <circle cx="38" cy="45" r="3" />
        <circle cx="62" cy="45" r="3" />
        <path d="M37 59 Q50 69 63 59" fill="none" stroke-width="3" stroke-linecap="round" />
      </g>
    </svg>

    <!-- 星星（--x/--y 位置、--d 閃爍延遲） -->
    <span class="star" style="--x:14%;--y:16%;--s:2px;--d:0s"></span>
    <span class="star" style="--x:26%;--y:9%;--s:1.5px;--d:1.1s"></span>
    <span class="star" style="--x:63%;--y:12%;--s:2.5px;--d:.5s"></span>
    <span class="star" style="--x:82%;--y:20%;--s:1.5px;--d:1.8s"></span>
    <span class="star" style="--x:47%;--y:7%;--s:2px;--d:2.4s"></span>
    <span class="star" style="--x:91%;--y:38%;--s:2px;--d:1.4s"></span>
    <span class="star" style="--x:8%;--y:34%;--s:1.5px;--d:3s"></span>
    <span class="star" style="--x:72%;--y:28%;--s:1.5px;--d:.8s"></span>

    <!-- 飛過的蝙蝠 -->
    <svg class="bat bat-1" viewBox="0 0 80 40"><g class="wings">
      <ellipse cx="40" cy="21" rx="3.5" ry="6"/>
      <path d="M40 22 C36 12 30 14 24 9 C25 15 19 17 13 15 C19 19 18 25 24 24 C30 23 35 24 40 26 Z
               M40 22 C44 12 50 14 56 9 C55 15 61 17 67 15 C61 19 62 25 56 24 C50 23 45 24 40 26 Z"/>
      <path d="M37 15 l1.4 -6 l2 5 z M43 15 l-1.4 -6 l-2 5 z"/>
    </g></svg>
    <svg class="bat bat-2" viewBox="0 0 80 40"><g class="wings">
      <ellipse cx="40" cy="21" rx="3.5" ry="6"/>
      <path d="M40 22 C36 12 30 14 24 9 C25 15 19 17 13 15 C19 19 18 25 24 24 C30 23 35 24 40 26 Z
               M40 22 C44 12 50 14 56 9 C55 15 61 17 67 15 C61 19 62 25 56 24 C50 23 45 24 40 26 Z"/>
      <path d="M37 15 l1.4 -6 l2 5 z M43 15 l-1.4 -6 l-2 5 z"/>
    </g></svg>
    <svg class="bat bat-3" viewBox="0 0 80 40"><g class="wings">
      <ellipse cx="40" cy="21" rx="3.5" ry="6"/>
      <path d="M40 22 C36 12 30 14 24 9 C25 15 19 17 13 15 C19 19 18 25 24 24 C30 23 35 24 40 26 Z
               M40 22 C44 12 50 14 56 9 C55 15 61 17 67 15 C61 19 62 25 56 24 C50 23 45 24 40 26 Z"/>
      <path d="M37 15 l1.4 -6 l2 5 z M43 15 l-1.4 -6 l-2 5 z"/>
    </g></svg>

    <!-- 飛過的鳥（成對） -->
    <svg class="bird bird-1" viewBox="0 0 60 24"><g class="wings">
      <ellipse cx="30" cy="12" rx="2.4" ry="3.2"/>
      <path d="M30 12 C24 5 16 6 8 11 C15 9 22 11 30 14 C38 11 45 9 52 11 C44 6 36 5 30 12 Z"/>
    </g></svg>
    <svg class="bird bird-2" viewBox="0 0 60 24"><g class="wings">
      <ellipse cx="30" cy="12" rx="2.4" ry="3.2"/>
      <path d="M30 12 C24 5 16 6 8 11 C15 9 22 11 30 14 C38 11 45 9 52 11 C44 6 36 5 30 12 Z"/>
    </g></svg>

    <!-- 滑翔的貓頭鷹 -->
    <svg class="owl-fly" viewBox="0 0 90 44"><g class="wings">
      <ellipse cx="45" cy="24" rx="7" ry="9"/>
      <path d="M45 22 C38 10 26 12 14 6 C18 16 8 20 2 20 C12 24 14 30 24 28 C34 26 40 26 45 28 Z
               M45 22 C52 10 64 12 76 6 C72 16 82 20 88 20 C78 24 76 30 66 28 C56 26 50 26 45 28 Z"/>
      <path d="M41 12 l1.6 -6 l2.2 5 z M49 12 l-1.6 -6 l-2.2 5 z"/>
    </g></svg>

    <!-- 樹枝與停棲的貓頭鷹（右下角） -->
    <svg class="branch" viewBox="0 0 340 170" preserveAspectRatio="xMaxYMax meet">
      <defs>
        <!-- 讓輪廓變毛茸茸的位移濾鏡 -->
        <filter id="fuzzy" x="-25%" y="-25%" width="150%" height="150%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path class="bough" d="M340 92 C286 86 236 78 186 84 C150 88 120 82 92 96 M186 84 C160 70 150 60 138 46 M120 88 C104 82 92 74 84 62"
            fill="none" stroke-width="7" stroke-linecap="round"/>
      <!-- 小葉 -->
      <path class="leaf" d="M138 46 q-8 -8 -2 -16 q8 6 2 16 Z"/>
      <path class="leaf" d="M84 62 q-9 -5 -6 -15 q9 4 6 15 Z"/>

      <!-- 貓頭鷹 A -->
      <g class="owl owl-a" transform="translate(150 40)">
        <path class="owl-sil" filter="url(#fuzzy)" d="M12 6 l4 -9 l5 10 M28 8 l4 -9 l4 9
          M20 -2 C31 -2 37 8 37 22 C37 38 30 50 20 50 C10 50 3 38 3 22 C3 8 9 -2 20 -2 Z"/>
        <circle class="owl-eye" cx="13" cy="18" r="4.2"/>
        <circle class="owl-eye" cx="27" cy="18" r="4.2"/>
        <path class="owl-beak" d="M20 22 l-2.5 4 h5 z"/>
      </g>

      <!-- 貓頭鷹 B（較小） -->
      <g class="owl owl-b" transform="translate(238 60) scale(0.8)">
        <path class="owl-sil" filter="url(#fuzzy)" d="M12 6 l4 -9 l5 10 M28 8 l4 -9 l4 9
          M20 -2 C31 -2 37 8 37 22 C37 38 30 50 20 50 C10 50 3 38 3 22 C3 8 9 -2 20 -2 Z"/>
        <circle class="owl-eye" cx="13" cy="18" r="4.2"/>
        <circle class="owl-eye" cx="27" cy="18" r="4.2"/>
        <path class="owl-beak" d="M20 22 l-2.5 4 h5 z"/>
      </g>
    </svg>
  </div>

  <main class="stage">

    <!-- 畫面 0：首頁選單（直接開啟／未指定呼吸法時顯示；Flex 深連結會略過此頁） -->
    <section id="screen-menu" class="screen">
      <p class="eyebrow">靜息 · BREATHE</p>
      <h1 class="menu-title">選一種呼吸<br />讓自己慢下來</h1>
      <ul class="mode-list" id="mode-list"><!-- JS 依 patterns 產生 --></ul>
    </section>

    <!-- 畫面 1：引導（呼吸法由 Flex message 帶 ?type= 進入；開始/重新開始皆在此） -->
    <section id="screen-guide" class="screen">
      <button class="guide-back" id="btn-menu" aria-label="返回選單">‹ 選單</button>
      <p class="eyebrow">呼吸練習</p>
      <h2 class="guide-title" id="guide-title">4-7-8 呼吸法</h2>
      <p class="guide-sub" id="guide-sub"></p>

      <div class="orb-wrap">
        <div class="orb-halo" id="orb-halo"></div>
        <div class="orb" id="orb">
          <div class="orb-inner">
            <span class="phase-label" id="phase-label">準備</span>
            <span class="phase-count" id="phase-count">—</span>
          </div>
        </div>
      </div>

      <p class="phase-hint" id="phase-hint"></p>

      <div class="controls">
        <button class="btn-primary" id="btn-start">開始</button>
        <div class="ctl-row" id="ctl-row">
          <button class="ctl" id="btn-pause" aria-label="暫停或繼續">暫停</button>
          <button class="ctl" id="btn-sound" aria-label="音效開關">♪ 音效</button>
          <button class="ctl" id="btn-stop" aria-label="結束">結束</button>
        </div>
      </div>
    </section>

    <!-- 畫面 2：完成（滿版） -->
    <section id="screen-done" class="screen">
      <div class="done-card">
        <div class="done-mark">🌿</div>
        <h2 class="done-title">完成</h2>
        <p class="done-sub">願你帶著這份平靜，繼續今天。</p>
        <button class="btn-primary" id="btn-again">再做一次</button>
        <button class="btn-ghost" id="btn-close">關閉</button>
      </div>
    </section>

  </main>

  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- 應用程式模組 -->
  <script src="js/patterns.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/breathing.js"></script>
  <script src="js/liff-init.js"></script>

  <!-- 介面接線（DOM × 引擎 × LIFF） -->
  <script>
    (function () {
      const screens = {
        menu: document.getElementById('screen-menu'),
        guide: document.getElementById('screen-guide'),
        done: document.getElementById('screen-done'),
      };

      const el = {
        modeList: document.getElementById('mode-list'),
        btnMenu: document.getElementById('btn-menu'),
        guideEl: document.getElementById('screen-guide'),
        guideTitle: document.getElementById('guide-title'),
        guideSub: document.getElementById('guide-sub'),
        orb: document.getElementById('orb'),
        halo: document.getElementById('orb-halo'),
        phaseLabel: document.getElementById('phase-label'),
        phaseCount: document.getElementById('phase-count'),
        phaseHint: document.getElementById('phase-hint'),
        btnStart: document.getElementById('btn-start'),
        btnPause: document.getElementById('btn-pause'),
        btnSound: document.getElementById('btn-sound'),
        btnStop: document.getElementById('btn-stop'),
        btnAgain: document.getElementById('btn-again'),
        btnClose: document.getElementById('btn-close'),
      };

      const audio = new window.BreathAudio();
      let engine = null;
      let currentType = window.DEFAULT_PATTERN;
      let currentScreen = null;
      let cameFromMenu = false; // 由首頁選單進入時，引導畫面顯示「返回選單」

      const DIFF_LEVEL = { '入門': 1, '初級': 2, '中級': 3 };

      // —— 上下滑動轉場 ——
      // dir='down'：目標從下方滑入（往下到完成頁）；dir='up'：目標從上方滑入（往上回引導頁）
      function activate(name, dir) {
        const target = screens[name];
        if (currentScreen === target) return;

        if (!currentScreen) {
          target.classList.add('is-active');
          currentScreen = target;
          return;
        }

        const prev = currentScreen;
        target.classList.remove('is-active', 'above', 'below');
        target.classList.add(dir === 'down' ? 'below' : 'above'); // 進場起點
        prev.classList.remove('is-active');
        prev.classList.add(dir === 'down' ? 'above' : 'below');    // 舊畫面退場方向

        requestAnimationFrame(() => requestAnimationFrame(() => {
          target.classList.remove('above', 'below');
          target.classList.add('is-active');
        }));
        currentScreen = target;
      }

      // —— 呼吸圈回到待機狀態 ——
      function setOrbIdle() {
        el.orb.classList.remove('paused');
        el.orb.style.transitionDuration = '0.6s';
        el.halo.style.transitionDuration = '0.6s';
        el.orb.style.transform = 'scale(0.5)';
        el.halo.style.transform = 'scale(0.62)';
        el.halo.style.opacity = '0.4';
        el.phaseLabel.textContent = '準備';
        el.phaseCount.textContent = '—';
        el.phaseHint.textContent = '';
      }

      // —— 首頁選單 ——
      function durationText(p) {
        const total = p.phases.reduce((a, ph) => a + ph.sec, 0) * p.cycles;
        const mins = Math.round(total / 60);
        return p.cycles + ' 個循環 · 約 ' + (mins < 1 ? '不到 1' : mins) + ' 分鐘';
      }

      function buildMenu() {
        el.modeList.innerHTML = '';
        Object.values(window.BREATHING_PATTERNS).forEach((p, i) => {
          const li = document.createElement('li');
          li.className = 'mode-item';
          li.style.setProperty('--i', i);
          const lvl = DIFF_LEVEL[p.difficulty] || 1;
          li.innerHTML =
            '<div class="mode-head">' +
              '<span class="mode-name">' + p.name + '</span>' +
              '<span class="mode-diff diff-' + lvl + '">' + p.difficulty + '</span>' +
            '</div>' +
            '<p class="mode-intro">' + p.intro + '</p>' +
            '<p class="mode-situation">適合：' + p.situation + '</p>' +
            '<p class="mode-meta">' + durationText(p) + '</p>';
          li.addEventListener('click', () => selectFromMenu(p.id));
          el.modeList.appendChild(li);
        });
      }

      function selectFromMenu(type) {
        cameFromMenu = true;
        loadGuide(type);
        activate('guide', 'down'); // 往下進入引導畫面
      }

      // —— 載入某呼吸法到引導畫面（待機） ——
      function loadGuide(type) {
        currentType = type;
        const p = window.BREATHING_PATTERNS[type];
        el.guideTitle.textContent = p.name;
        el.guideSub.textContent = durationText(p);
        el.guideEl.classList.remove('running');
        el.guideEl.classList.toggle('from-menu', cameFromMenu); // 有選單來源才顯示返回鍵
        el.btnStart.textContent = '開始';
        setOrbIdle();
      }

      // —— 開始 / 重新開始（同一顆按鈕） ——
      function startRun() {
        if (engine) engine.stop();
        const pattern = window.BREATHING_PATTERNS[currentType];

        el.guideEl.classList.add('running');
        el.btnStart.textContent = '重新開始';
        el.btnPause.textContent = '暫停';
        setOrbIdle(); // 讓第一次吸氣從小圈擴起

        engine = new window.BreathingEngine(pattern, {
          onPhaseStart(phase, cycleIndex, totalCycles) {
            el.guideSub.textContent = '第 ' + (cycleIndex + 1) + ' / ' + totalCycles + ' 循環';
            el.phaseLabel.textContent = phase.label;
            el.phaseHint.textContent = phase.hint || '';
            // 呼吸圈：轉場時間 = 該階段秒數，與引導同步
            el.orb.style.transitionDuration = phase.sec + 's';
            el.halo.style.transitionDuration = phase.sec + 's';
            el.orb.style.transform = 'scale(' + phase.scale + ')';
            el.halo.style.transform = 'scale(' + (phase.scale * 1.25) + ')';
            el.halo.style.opacity = phase.scale > 0.7 ? '0.9' : '0.45';
            audio.cue(phase.tone);
          },
          onTick(remainingSec) {
            el.phaseCount.textContent = remainingSec;
          },
          onComplete() {
            audio.cue(528, 1.2);
            finishToDone();
          },
        });
        engine.start();
      }

      function finishToDone() {
        el.guideEl.classList.remove('running');
        activate('done', 'down'); // 自動往下跳到完成頁
      }

      // —— 事件 ——
      el.btnStart.addEventListener('click', async () => {
        await audio.unlock(); // 必須在使用者手勢中啟動 AudioContext
        startRun();           // 第一次=開始；之後=重新開始
      });

      el.btnPause.addEventListener('click', () => {
        if (!engine) return;
        const paused = engine.togglePause();
        el.btnPause.textContent = paused ? '繼續' : '暫停';
        el.orb.classList.toggle('paused', paused);
      });

      el.btnSound.addEventListener('click', () => {
        audio.enabled = !audio.enabled;
        el.btnSound.classList.toggle('off', !audio.enabled);
        el.btnSound.textContent = audio.enabled ? '♪ 音效' : '♪ 靜音';
      });

      el.btnStop.addEventListener('click', () => {
        if (engine) engine.stop();
        finishToDone(); // 按結束 → 自動往下跳到完成頁
      });

      el.btnAgain.addEventListener('click', () => {
        loadGuide(currentType);   // 重置引導畫面，開始鈕回到「開始」
        activate('guide', 'up');  // 自動往上跳回引導畫面
      });

      el.btnClose.addEventListener('click', () => window.AppLiff.close());

      el.btnMenu.addEventListener('click', () => {
        if (engine) engine.stop();
        activate('menu', 'up'); // 往上返回首頁選單
      });

      // —— 啟動 ——
      // Flex 深連結帶 ?type= → 直接進入該呼吸法的引導畫面。
      // 未指定（直接開啟首頁）→ 顯示呼吸法選單。
      (async function boot() {
        await window.AppLiff.init();
        buildMenu();
        if (window.AppLiff.hasType()) {
          cameFromMenu = false;
          loadGuide(window.AppLiff.getType());
          activate('guide');
        } else {
          activate('menu');
        }
      })();
    })();
  </script>
</body>
</html>
