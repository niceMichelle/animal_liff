<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>律動 · 靜息</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --c-night: #0a0e23; --c-deep: #121a3a;
      --c-mist: #e9ecf7; --c-mist-dim: #97a0c4;
      --c-orb-a: #8fe3d6; --c-orb-b: #6f8bf0; --c-orb-c: #b89cf0; --c-accent: #f3d9a4;
      --font-zh: 'Noto Serif TC', serif;
      --ease: cubic-bezier(0.45, 0.05, 0.4, 0.95);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-zh); color: var(--c-mist);
      background: radial-gradient(140% 120% at 50% -10%, var(--c-deep) 0%, var(--c-night) 55%, #05071a 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      min-height: 100vh; min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
    }
    .aurora {
      position: fixed; inset: -25%; z-index: 0; pointer-events: none;
      background:
        radial-gradient(38% 32% at 24% 26%, rgba(111,139,240,0.34), transparent 70%),
        radial-gradient(34% 30% at 78% 22%, rgba(184,156,240,0.28), transparent 70%),
        radial-gradient(46% 40% at 60% 90%, rgba(31,109,107,0.34), transparent 72%);
      filter: blur(30px) saturate(120%);
      animation: drift 26s var(--ease) infinite alternate;
    }
    @keyframes drift {
      0%   { transform: translate3d(-3%,-2%,0) scale(1.05); opacity: 0.85; }
      100% { transform: translate3d(4%,-3%,0) scale(1.1);  opacity: 0.7; }
    }
    .wrap { position: relative; z-index: 1; width: 100%; max-width: 460px; }
    .eyebrow {
      font-size: 0.72rem; letter-spacing: 0.42em; text-transform: uppercase;
      color: var(--c-accent); opacity: 0.85; margin-bottom: 1rem; padding-left: 0.42em;
    }
    .title {
      font-weight: 400; font-size: clamp(1.7rem, 7vw, 2.3rem);
      line-height: 1.45; letter-spacing: 0.04em; margin-bottom: 0.6rem;
    }
    .lede {
      font-size: 0.9rem; font-weight: 300; line-height: 1.9;
      color: var(--c-mist-dim); margin-bottom: 2rem;
    }
    .cards { display: flex; flex-direction: column; gap: 16px; }
    .card {
      position: relative; display: flex; align-items: center; gap: 16px;
      text-align: left; text-decoration: none; color: inherit;
      padding: 20px 20px; border: 1px solid rgba(233,236,247,0.14); border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      backdrop-filter: blur(8px); overflow: hidden;
      transition: transform 0.4s var(--ease), border-color 0.4s, background 0.4s;
      animation: rise 0.6s var(--ease) both;
    }
    .card:nth-child(2) { animation-delay: 0.12s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: linear-gradient(var(--c-orb-a), var(--c-orb-b)); opacity: 0.4; transition: opacity 0.4s;
    }
    .card.step::before { background: linear-gradient(var(--c-orb-b), var(--c-orb-c)); }
    .card:hover, .card:active { transform: translateY(-3px); border-color: rgba(143,227,214,0.5); background: linear-gradient(135deg, rgba(143,227,214,0.10), rgba(111,139,240,0.05)); }
    .card:hover::before, .card:focus-visible::before { opacity: 1; }
    .card:focus-visible { outline: 2px solid var(--c-orb-a); outline-offset: 3px; }
    .glyph { flex: none; width: 52px; height: 52px; display: grid; place-items: center; }
    .glyph svg { width: 100%; height: 100%; overflow: visible; }
    .breath-ring { fill: none; stroke: var(--c-orb-a); stroke-width: 2.5; opacity: 0.9; transform-origin: center; animation: breathe 6s var(--ease) infinite; }
    .breath-ring.r2 { stroke: var(--c-orb-b); opacity: 0.5; animation-delay: 0.6s; }
    @keyframes breathe { 0%,100% { transform: scale(0.7); opacity: 0.5; } 50% { transform: scale(1); opacity: 0.95; } }
    .beat { fill: var(--c-orb-b); opacity: 0.35; transform-origin: center; }
    .beat.on { animation: pulse 1.4s steps(1) infinite; }
    .beat.b1 { animation-delay: 0s; } .beat.b2 { animation-delay: 0.35s; }
    .beat.b3 { animation-delay: 0.7s; } .beat.b4 { animation-delay: 1.05s; }
    @keyframes pulse { 0%,25% { fill: var(--c-orb-a); opacity: 1; transform: scale(1.35); } 26%,100% { fill: var(--c-orb-b); opacity: 0.35; transform: scale(1); } }
    .card-body { flex: 1; min-width: 0; }
    .card-name { font-size: 1.16rem; font-weight: 500; letter-spacing: 0.05em; margin-bottom: 0.3rem; }
    .card-desc { font-size: 0.82rem; font-weight: 300; line-height: 1.7; color: var(--c-mist-dim); }
    .card-arrow { flex: none; color: var(--c-mist-dim); font-size: 1.3rem; transition: transform 0.3s var(--ease), color 0.3s; }
    .card:hover .card-arrow { color: var(--c-orb-a); transform: translateX(3px); }
    .foot { margin-top: 2rem; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--c-mist-dim); opacity: 0.7; }
    @media (prefers-reduced-motion: reduce) {
      .aurora, .breath-ring, .beat.on, .card { animation: none; }
      .card { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>

  <main class="wrap">
    <p class="eyebrow">LINE · 放鬆與運動</p>
    <h1 class="title">今天想怎麼<br />照顧自己？</h1>
    <p class="lede">選一種節奏，跟著畫面與聲音<br />慢慢把身心安頓下來。</p>

    <nav class="cards">
      <a class="card breathe" href="breathing/">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 52 52">
            <circle class="breath-ring r1" cx="26" cy="26" r="15" />
            <circle class="breath-ring r2" cx="26" cy="26" r="22" />
          </svg>
        </span>
        <span class="card-body">
          <span class="card-name">呼吸練習</span>
          <span class="card-desc">跟著呼吸圈與柔和音效，4-7-8、箱式、腹式、正念放鬆。</span>
        </span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>

      <a class="card step" href="step/">
        <span class="glyph" aria-hidden="true">
          <svg viewBox="0 0 52 52">
            <circle class="beat on b1" cx="11" cy="26" r="4.5" />
            <circle class="beat on b2" cx="21" cy="26" r="4.5" />
            <circle class="beat on b3" cx="31" cy="26" r="4.5" />
            <circle class="beat on b4" cx="41" cy="26" r="4.5" />
          </svg>
        </span>
        <span class="card-body">
          <span class="card-name">節律步伐</span>
          <span class="card-desc">跟著節拍做原地踏步、併步、方塊步與綜合舞步暖身。</span>
        </span>
        <span class="card-arrow" aria-hidden="true">→</span>
      </a>
    </nav>

    <p class="foot">跟著節奏，動一動就好</p>
  </main>
</body>
</html>
